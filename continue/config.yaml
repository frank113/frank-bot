name: Local Config
version: 1.0.0
schema: v1
models:
  - name: Llama 3.1 8B
    provider: ollama
    model: llama3.1:8b
    roles:
      - chat
      - edit
      - apply
  - name: Gemma4 31b High
    provider: ollama
    model: gemma4:high
    roles:
      - chat
    keepAlive: 30m
    capabilities:
      - tool_use
      - image_input
  - name: Qwen2.5-Coder 1.5B (Always On)
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles:
      - autocomplete
    keepAlive: -1
  - name: Qwen2.5-Coder 7B (Power)
    provider: ollama
    model: qwen2.5-coder:7b-base
    roles:
      - autocomplete
    keepAlive: 20m
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed

tabAutocompleteOptions:
  debounceDelay: 300
  maxPromptTokens: 1024
  multilineCompletions: auto
  logCompletions: true
